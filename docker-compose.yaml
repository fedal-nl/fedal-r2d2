services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fedal-api-r2d2
    image: fedal-api-r2d2:latest
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    volumes:
      - .:/app   # only sync your source code
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
