services:
  api:
    container_name: fedal-api-r2d2
    build:
      context: .
      dockerfile: Dockerfile
    # Rebuild the development image when Compose starts so changes to
    # pyproject.toml or uv.lock are installed in the container.
    pull_policy: build
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fedal}:${POSTGRES_PASSWORD:-fedal_local_password}@postgres:5432/${POSTGRES_DB:-fedal_r2d2}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-before-deploying-32chars}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: postgres:18-alpine
    pull_policy: missing
    container_name: fedal-r2d2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fedal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fedal_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-fedal_r2d2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
