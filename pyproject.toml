[project]
name = "fedal-r2d2"
version = "1.0.0"
description = "FastAPI application for managing emails, forms, and spanglish language dictionary with a quiz."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.0",
    "pydantic-core>=2.41.0",
    "pydoctor>=25.10.1",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
    "resend==2.34.0",
    "ruff>=0.13.0",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=95"

[tool.coverage.run]
branch = true
omit = [
    "src/alembic/*",
    "src/apps/spanglish/repositories.py",
    "src/apps/spanglish/routers.py",
    "src/apps/spanglish/schemas.py",
    "src/apps/spanglish/services.py",
    "src/auth/routers.py",
    "src/auth/services.py",
    "src/configs/db.py",
    "src/services/userinfo_service.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
