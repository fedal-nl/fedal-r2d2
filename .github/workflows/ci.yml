name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check src tests

      - name: Test with at least 95% coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
          RESEND_API_KEY: re_test
          EMAIL_FROM: R2D2 <noreply@example.com>
          EMAIL_TO: owner@example.com
          RECAPTCHA_SECRET_KEY: recaptcha-test-secret
          API_TOKEN: api-test-token
        run: uv run pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve and validate image version
        id: version
        shell: bash
        run: |
          project_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          if [[ -z "${project_version}" ]]; then
            echo "Could not read the project version from pyproject.toml" >&2
            exit 1
          fi
          image_tag="v${project_version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${image_tag}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${image_tag}" >&2
            exit 1
          fi
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ghcr.io/fedal-nl/fedal-r2d2:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
